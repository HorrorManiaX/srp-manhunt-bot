buildscript {
    repositories { maven { url = "https://maven.minecraftforge.net/" }; mavenCentral() }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT' }
}
apply plugin: 'net.minecraftforge.gradle.forge'
version = '1.0.0'
group = 'com.vagrantvision'
archivesBaseName = 'VagrantVision'
sourceCompatibility = 1.8
targetCompatibility = 1.8
minecraft {
    version = '1.12.2-14.23.5.2847'
    runDir = 'run'
    mappings = 'snapshot_20171003'
}
repositories { mavenCentral() }
def cotesia = file('libs/srpcotesia-1.12.2-1.4.0-bleedingedge.3.jar')
if (cotesia.exists()) {
    dependencies { compile files(cotesia) }
} else {
    sourceSets.main.java.srcDir 'src/compileApi/java'
}
jar { exclude 'com/srpcotesia/**' }
processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}

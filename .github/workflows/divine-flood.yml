name: Divine Flood Forge 1.12.2
on:
  push:
    branches: [divine-flood-1.12.2]
    paths:
      - 'divine-flood/**'
      - '.github/workflows/divine-flood.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Compile and reobfuscate
        working-directory: divine-flood
        run: gradle --no-daemon clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DivineFlood-1.0.0
          path: divine-flood/build/libs/DivineFlood-1.0.0.jar
          if-no-files-found: error
